# Measure, on hardware somebody owns, and keep the history.
#
# The opposite of conformance.yml in every respect. That one runs anywhere and
# reads no timing; this one runs only on machines registered as self-hosted
# runners, and timing is the entire point. Nothing here will ever run on a
# GitHub-hosted runner — there is no `runs-on: ubuntu-latest` in this file and
# there must not be, because a shared cloud VM cannot produce a number worth
# putting in a history that future work is compared against.
#
# Each machine is its own Bencher *testbed*, so its history is only ever compared
# with itself. An M2 and a Cortex-A76 are not two samples of one population, and
# a threshold that averaged them would alert on neither.
#
# Setting up a runner, and what the thresholds mean: BENCHMARKING.md
#
# Manual by default. These runners are somebody's laptop.

name: benchmark

on:
  workflow_dispatch:
    inputs:
      testbeds:
        description: "Which machines to run on (comma-separated labels, or 'all')"
        default: all
        type: string
      timing-seconds:
        description: "Timing window per variant, seconds"
        default: "30"
        type: string
      submodels:
        description: "Which submodels to measure (A2 standard, A2 nano, or both)"
        default: widest,narrowest
        type: string

permissions:
  contents: read

# One benchmark at a time, globally. Two runs sharing a machine would measure
# each other, and the queue is preferable to the alternative — so this must not
# cancel in progress.
concurrency:
  group: benchmark
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Which machines to run on.
  #
  # The obvious way to write this — a static matrix plus a job-level
  # `if: contains(inputs.testbeds, matrix.testbed)` — is not merely wrong, it is
  # rejected: the `matrix` context is not available in a job-level `if`, and
  # GitHub fails the whole workflow file for it. It does that on every push,
  # even though this workflow is workflow_dispatch only, which is a confusing
  # way to find out.
  #
  # So the selection happens here, in a place where it is allowed to, and
  # `measure` consumes the filtered matrix. Filtering rather than skipping also
  # means an unselected machine is never asked for a runner — which matters when
  # the runner is a laptop that may be shut.
  # ---------------------------------------------------------------------------
  plan:
    name: choose testbeds
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        env:
          WANTED: ${{ inputs.testbeds }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, sys

          # driver: `xcode` is the canonical tool — the one every published
          # number came from — and is used wherever it can run. `portable` is
          # Tools/nam_benchmark, which exists because the Pi cannot run the
          # other one. The two agree to well under 1% on the same machine, but
          # each testbed sticks to one of them for life, so no history ever
          # contains a mixture.
          machines = [
              {"testbed": "m2-air", "driver": "xcode",
               "runner": ["self-hosted", "macOS", "ARM64", "nambench-m2air"]},
              {"testbed": "m1-air", "driver": "xcode",
               "runner": ["self-hosted", "macOS", "ARM64", "nambench-m1air"]},
              {"testbed": "pi500", "driver": "portable", "cpu-set": "0-3",
               "runner": ["self-hosted", "Linux", "ARM64", "nambench-pi500"]},
              # ASUS Tinker Board, Rockchip RK3288: quad Cortex-A17, 32-bit
              # ARMv7-A. The SoC in the HeadRush Core and Prime, and the only
              # 32-bit testbed here. Its line-up is the same a2_fast against
              # a2_planar as everywhere else, since the planar gate widened to
              # 32-bit ARM with NEON and FMA.
              #
              # `cross` rather than `portable`, and it runs on the *Pi's*
              # runner. The board has no toolchain, no cmake and 2 GB of RAM, so
              # it cannot build the thing that measures it and there is no
              # runner on it; the Pi cross-builds, rsyncs the static binaries
              # over ssh and brings the reports back. `board` is the ssh host —
              # give it a Host entry in the runner user's ~/.ssh/config.
              #
              # max-freq is a soak-measured number, not a round one: at 1416 MHz
              # the RK3288 sits 8.8 °C under its passive trip and holds, and all
              # four cores share one cpufreq policy, so a run whose clock moved
              # is void rather than noisy. See A32-PATH.md.
              {"testbed": "tinker", "driver": "cross", "cpu-set": "0-3",
               "board": "tib", "max-freq": "1416000",
               "runner": ["self-hosted", "Linux", "ARM64", "nambench-pi500"]},
          ]
          known = {m["testbed"] for m in machines}

          wanted = (os.environ.get("WANTED") or "all").strip()
          if wanted == "all":
              chosen = machines
          else:
              names = {n.strip() for n in wanted.split(",") if n.strip()}
              unknown = names - known
              if unknown:
                  sys.exit(f"unknown testbed(s): {', '.join(sorted(unknown))}. "
                           f"Known: {', '.join(sorted(known))}")
              chosen = [m for m in machines if m["testbed"] in names]

          if not chosen:
              sys.exit("no testbeds selected")

          print("matrix=" + json.dumps({"include": chosen}))
          PY

  measure:
    needs: plan
    name: ${{ matrix.testbed }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      # Never parallel: these are physical machines, and on a laptop that also
      # has a browser open the only thing worse than a slow benchmark is two.
      max-parallel: 1
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      # Not cached. A benchmark runner is a machine somebody owns, so the
      # checkouts persist between runs anyway, and fetch-vendor.sh is a no-op
      # when they are already at the pinned commits. It still re-asserts that
      # both variants pin the same Eigen and that a2_fast is byte-identical
      # across them, which is worth doing before every measurement.
      - name: Fetch pinned sources
        run: ./Scripts/fetch-vendor.sh

      # --- Can we still talk to Bencher? --------------------------------
      #
      # Before the build and the measurement, for the same reason
      # Scripts/track-benchmark.sh does it: these are physical machines held
      # quiet for minutes at a time, and a rotated secret or a renamed project
      # discovered at the upload throws all of that away. One GET says so first.
      #
      # A missing secret is still not an error — it means "measure, do not
      # publish", which is a legitimate way to run this workflow.
      - uses: bencherdev/bencher@main

      - name: Check Bencher is reachable
        env:
          BENCHER_API_KEY: ${{ secrets.BENCHER_API_KEY || secrets.BENCHER_API_TOKEN }}
          BENCHER_PROJECT: ${{ vars.BENCHER_PROJECT }}
        run: |
          if [ -z "${BENCHER_API_KEY:-}" ] || [ -z "${BENCHER_PROJECT:-}" ]; then
            echo "::warning::BENCHER_API_KEY secret or BENCHER_PROJECT variable is unset;"\
                 "this run will measure but not upload. See BENCHMARKING.md."
            exit 0
          fi
          bencher project view "$BENCHER_PROJECT" > /dev/null

      # --- The portable driver ------------------------------------------
      - name: Build (portable)
        if: matrix.driver == 'portable'
        run: |
          cmake -S . -B build-benchmark \
            -DCMAKE_BUILD_TYPE=Release \
            -DNAMBENCH_BUILD_BENCHMARK=ON
          cmake --build build-benchmark --target nam_benchmark --parallel 4

      - name: Measure (portable)
        if: matrix.driver == 'portable'
        run: |
          ./Scripts/run-benchmark.sh \
            --build-dir build-benchmark \
            --submodels "${{ inputs.submodels }}" \
            --output-dir "$PWD/benchmark-results" \
            --bmf bmf.json \
            ${{ matrix.cpu-set && format('--cpu-set {0}', matrix.cpu-set) || '' }} \
            -- \
            --timing-seconds "${{ inputs.timing-seconds }}"

      # --- The cross driver: build here, measure on a board over ssh -----
      #
      # No build step of its own, because a32-deploy.sh configures, builds and
      # runs the codegen check as one thing — a kernel claiming bit-identity
      # that emitted a non-fused vmla should fail before the binaries are
      # copied, not after half an hour of measuring.
      #
      # The measurement itself happens on the board, under the copy of
      # run-benchmark.sh that a32-deploy.sh puts there, so the governor, the
      # frequency cap and the residency check are the same ones the portable
      # driver uses. The BMF comes back here: the board has no checkout to
      # convert with and no business holding an API key.
      - name: Build and measure (cross)
        if: matrix.driver == 'cross'
        run: |
          # Both matrix values are conditional in the same way the portable
          # driver's --cpu-set is: a board entry that omitted one must drop the
          # flag, not pass it empty. `--max-freq ""` would reach the point of
          # writing an empty string into scaling_max_freq.
          #
          # The two `--` are not a typo: the first hands the rest to
          # run-benchmark.sh on the board, the second hands the rest of that to
          # nam_benchmark.
          ./Scripts/a32-deploy.sh \
            --host "${{ matrix.board }}" \
            --step bench \
            ${{ matrix.cpu-set && format('--cpu-set {0}', matrix.cpu-set) || '' }} \
            --bmf bmf.json \
            -- \
            --submodels "${{ inputs.submodels }}" \
            ${{ matrix.max-freq && format('--max-freq {0}', matrix.max-freq) || '' }} \
            -- \
            --timing-seconds "${{ inputs.timing-seconds }}"

      # --- The canonical Xcode driver -----------------------------------
      - name: Build (xcode)
        if: matrix.driver == 'xcode'
        run: |
          command -v xcodegen >/dev/null || {
            echo "xcodegen is not installed on this runner: brew install xcodegen" >&2
            exit 1
          }
          xcodegen generate
          xcodebuild -project NAMBench.xcodeproj -scheme nambench-cli \
            -configuration Release build

      - name: Measure (xcode)
        if: matrix.driver == 'xcode'
        run: |
          products="$(xcodebuild -project NAMBench.xcodeproj -scheme nambench-cli \
            -configuration Release -showBuildSettings \
            | awk -F' = ' '/ BUILT_PRODUCTS_DIR =/{print $2; exit}')"
          # Both submodels become separate Bencher series — a2_standard/* and
          # a2_nano/* — merged into one upload so a run is one report.
          reports=()
          IFS=','
          for submodel in ${{ inputs.submodels }}; do
            unset IFS
            echo "--- $submodel"
            "$products/nambench" \
              --submodel "$submodel" \
              --timing-seconds "${{ inputs.timing-seconds }}" \
              --output "$PWD/benchmark-results/$submodel"
            # The CLI stamps its own filename with the time it started.
            reports+=("$(ls -t "benchmark-results/$submodel"/*.json | head -1)")
            IFS=','
          done
          unset IFS
          python3 Scripts/bencher-report.py "${reports[@]}" --output bmf.json

      # --- Publish -------------------------------------------------------
      # The CLI was installed before the build, by the preflight above.
      - name: Track
        id: track
        env:
          # BENCHER_API_KEY, not BENCHER_API_TOKEN: the CLI reserves --token for
          # JWTs and rejects an API key handed to it. Either secret name works
          # here — plenty of setups still have it stored under the old one.
          BENCHER_API_KEY: ${{ secrets.BENCHER_API_KEY || secrets.BENCHER_API_TOKEN }}
          BENCHER_PROJECT: ${{ vars.BENCHER_PROJECT }}
        run: |
          if [ -z "${BENCHER_API_KEY:-}" ] || [ -z "${BENCHER_PROJECT:-}" ]; then
            echo "::warning::BENCHER_API_KEY secret or BENCHER_PROJECT variable is unset;"\
                 "the run is complete but nothing was uploaded. See BENCHMARKING.md."
            exit 0
          fi
          # The key reaches the CLI through the environment rather than argv:
          # process arguments are readable by anything else on the runner, and
          # these runners are somebody's laptop.
          #
          # No --threshold-* flags, and no --thresholds-reset. The threshold
          # model is owned by Scripts/bencher-sync.py below, in one place: these
          # flags have to be repeated identically by every upload path or
          # --thresholds-reset lets whichever ran last silently redefine the
          # model for the branch and testbed. --error-on-alert stays, because
          # honouring the threshold is this step's job even though defining it
          # is not.
          bencher run \
            --project "$BENCHER_PROJECT" \
            --branch "$GITHUB_REF_NAME" \
            --hash "$GITHUB_SHA" \
            --testbed "${{ matrix.testbed }}" \
            --adapter json \
            --file bmf.json \
            --error-on-alert

      # After the upload, so that a kernel or a machine measured for the first
      # time gets its threshold and its chart from the run that introduced it,
      # rather than from whenever somebody next remembers. Idempotent, and it
      # deletes nothing.
      #
      # Conditioned on Track having *run*, success or failure, rather than on
      # success: an --error-on-alert failure is exactly when the charts are
      # wanted, and a run that alerted still uploaded its metrics. A build that
      # never got as far as uploading skips this, so the step cannot fail a
      # second time over a CLI that was never installed.
      - name: Sync thresholds and plots
        if: steps.track.conclusion == 'success' || steps.track.conclusion == 'failure'
        env:
          BENCHER_API_KEY: ${{ secrets.BENCHER_API_KEY || secrets.BENCHER_API_TOKEN }}
          BENCHER_PROJECT: ${{ vars.BENCHER_PROJECT }}
        run: |
          if [ -z "${BENCHER_API_KEY:-}" ] || [ -z "${BENCHER_PROJECT:-}" ]; then
            exit 0
          fi
          # A branch gets thresholds, so a benchmark run on it is still checked.
          # It does not get pinned plots: a plot is a fixed set of UUIDs on a
          # project-wide dashboard limited to 64 of them, and one set per branch
          # would fill that with charts nobody asked for and nobody deletes.
          # Branch data is still there to be plotted ad hoc.
          args=(--branch "$GITHUB_REF_NAME")
          [ "$GITHUB_REF_NAME" = "main" ] || args+=(--skip-plots)
          python3 Scripts/bencher-sync.py "${args[@]}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-${{ matrix.testbed }}
          path: |
            benchmark-results/**/*.json
            bmf.json
          retention-days: 90
          if-no-files-found: warn
